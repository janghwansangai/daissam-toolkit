<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>다있쌤 화면 녹화</title>
<style>
@font-face{font-family:'Pretendard Variable';src:url(fonts/PretendardVariable.woff2) format('woff2');font-weight:45 920;font-display:swap}
:root{--ink:#173b36;--lime:#dff39c;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:#f6f9e9;font:14px/1.5 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard Variable','Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
button,select{font:inherit;color:inherit;cursor:pointer;border:0}
.top{display:flex;align-items:center;gap:8px;padding:12px 14px 6px}
.dot{width:12px;height:12px;border-radius:50%;background:#7d8877;flex:none}
.dot.live{background:#ff5a4a;box-shadow:0 0 0 0 rgba(255,90,74,.7);animation:pulse 1.4s infinite}
.dot.paused{background:#f5a524}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(255,90,74,0)}100%{box-shadow:0 0 0 0 rgba(255,90,74,0)}}
#clock{font:700 26px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.5px}
#what{margin-left:auto;font-size:12px;opacity:.7;text-align:right}
#say{padding:0 14px;font-size:12.5px;opacity:.85;min-height:20px}
#fix{padding:0 14px;font-size:12.5px;line-height:1.5}
#fix p{margin:6px 0}
#fix .small{opacity:.75;font-size:11.5px}
.controls{display:flex;gap:6px;padding:10px 14px 14px;margin-top:auto}
.controls button{flex:1;padding:10px 6px;border-radius:10px;background:rgba(255,255,255,.12);font-weight:600;font-size:13px}
.controls button:hover{background:rgba(255,255,255,.2)}
.controls button:disabled{opacity:.4;cursor:default}
.controls .stop{background:#ff5a4a;color:#fff}
.controls .go{background:var(--lime);color:var(--ink)}
.count{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,25,20,.92);font:800 96px/1 ui-monospace,Menlo,monospace;color:var(--lime);z-index:5}
.done{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.done video{width:100%;max-height:calc(100vh - 170px);background:#000;border-radius:10px}
.done .meta{font-size:12.5px;opacity:.8}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="top"><span class="dot" id="dot"></span><span id="clock">00:00</span><span id="what"></span></div>
<div id="say">녹화할 화면을 고르는 창이 곧 뜹니다…</div>
<div id="fix" hidden><div class="controls" style="padding:0 0 8px"><button id="retry" class="go">화면 고르기</button></div><div id="mac-help" hidden><p>‘전체 화면·창’ 이 흐리게 보였다면 맥에서 <b>Chrome 에 화면 기록 권한</b>을 한 번 줘야 합니다.</p><div class="controls" style="padding:0 0 8px"><button id="open-privacy">시스템 설정 열기</button></div><p class="small">허용한 뒤 <b>Chrome 을 완전히 껐다 켜야</b> 적용됩니다.</p></div></div>
<div class="controls" id="controls">
  <button id="pause" disabled>일시 정지</button>
  <button id="mute" disabled>마이크 끄기</button>
  <button id="stop" class="stop" disabled>■ 멈추고 저장</button>
  <button id="cancel">취소</button>
</div>
<section class="done" id="done" hidden>
  <video id="preview" controls playsinline></video>
  <div class="meta" id="meta"></div>
  <div class="controls" style="padding:0">
    <button id="save" class="go">내려받기 폴더에 저장</button>
    <button id="again">다시 녹화</button>
    <button id="close">닫기</button>
  </div>
</section>
<div class="count" id="count" hidden></div>
<script type="module" src="record.js"></script>
</body>
</html>
